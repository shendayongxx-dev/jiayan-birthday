<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211923"><meta name="description" content="一间藏着六份心意的生日小屋"><title>星光小屋 · 生日快乐</title><link rel="stylesheet" href="./style.css"></head><body>
<div class="sky" aria-hidden="true"><div id="fireflies"></div></div>
<main><header class="top"><span class="brand">✦ 星光小屋</span><div class="top-actions"><button id="sound" aria-label="开启背景音乐" title="背景音乐">♫</button><button id="help" aria-label="玩法说明" title="玩法说明">?</button></div></header>
<section class="intro"><div class="eyebrow">A LITTLE WORLD FOR YOU</div><h1>把一整个夜晚，<br>都送给你。</h1><p>欢迎来到藏着小小心意的星光小屋。<br>轻轻转动，点点喜欢的小东西。</p></section>
<div class="scene" id="scene" aria-label="可探索的生日小屋"><div class="room" id="room"><img src="./room-art.png" alt="温暖的立体生日小屋：粉色沙发、月亮画、书、留声机、小猫、花束和礼盒"><button class="hotspot moon" data-id="moon" aria-label="打开月亮画"></button><button class="hotspot book" data-id="book" aria-label="打开茶几上的书"></button><button class="hotspot gram" data-id="gram" aria-label="播放留声机"></button><button class="hotspot cat" data-id="cat" aria-label="摸摸小猫"></button><button class="hotspot flowers" data-id="flowers" aria-label="打开花束祝福"></button><button class="hotspot gift" data-id="gift" aria-label="打开礼盒"></button></div></div><div class="bubble" id="bubble" role="status"></div><p class="hint">左右拖动小屋 · 点按物件寻找惊喜</p><button class="explore" id="explore">寻找小惊喜 <span>✦</span></button>
<div class="bottom"><span>已发现 <strong id="count">0</strong> / 6 份小心意</span><button id="reset" aria-label="重置视角">⟳</button></div><div class="dots" id="dots" aria-label="探索进度"></div></main>
<div class="overlay" id="overlay" aria-hidden="true"><div class="card" role="dialog" aria-modal="true" aria-labelledby="title"><button class="close" id="close" aria-label="关闭">×</button><div class="wish-decor" id="wish-decor" aria-hidden="true" hidden><span class="sticker balloon one">🎈</span><span class="sticker balloon two">🎈</span><span class="sticker bow">🎀</span><span class="sticker heart">💗</span><span class="sticker cake-sticker">🧁</span><span class="sticker letter">💌</span><span class="twinkle t1">✦</span><span class="twinkle t2">✧</span><span class="twinkle t3">✦</span><span class="twinkle t4">✧</span></div><div class="card-stars">✦ · ✧ · ✦</div><div class="icon" id="icon"></div><img class="character" id="character" src="./birthday-girl.png" alt="小燕子的卡通生日贴纸" hidden><div class="card-kicker" id="kicker"></div><h2 id="title"></h2><div class="rule"></div><p id="copy"></p><div id="actions"></div><div class="card-foot">✧ &nbsp; FOR YOU &nbsp; ✧</div></div></div>
<script src="./app.js"></script></body></html>
